<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='8' fill='%230E7C86'/%3E%3Crect x='10' y='22' width='5' height='8' rx='1' fill='white'/%3E%3Crect x='17.5' y='16' width='5' height='14' rx='1' fill='white'/%3E%3Crect x='25' y='10' width='5' height='20' rx='1' fill='white'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-assisted RFP response drafting: classify, retrieve, draft with provenance, and export." />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)" />
    <title>RFP Response Assistant — Another Marketing Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Apply the persisted theme before first paint to prevent a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rfp_theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
