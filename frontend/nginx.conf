server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static bundle (hash-routed SPA — every path serves index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container (service name from docker-compose)
    location /api/ {
        proxy_pass http://backend:4010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # LLM calls can be slow
        client_max_body_size 25m;     # RFP uploads
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
