name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_LLM: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: Backend unit + integration (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend unit tests
        working-directory: backend
        run: python -m pytest tests/ -q
      - name: Root integration + adversarial suites
        run: python -m pytest tests/ -q
      - name: Tiered E2E runner
        run: python -m tests.runner

  frontend:
    name: Frontend build + theme gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Design-token lint gates
        run: bash scripts/lint-theme.sh
      - name: Production build
        run: npm run build --prefix frontend
      - name: Build artefact sanity check
        run: node frontend/scripts/validate-build.cjs
